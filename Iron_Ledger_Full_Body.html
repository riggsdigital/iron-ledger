<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iron Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first training ledger. Five tabs (Train, History, Exercises, Progress, Settings);
   the live workout is a full-screen log sheet. Colors borrow the IWF bumper-plate code and carry meaning:
   blue = action and charts, green = done / goal met, yellow = record, red = delete. */
:root{
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#ECEFF2; --surface:#FAFBFC; --ink:#11161C; --muted:#586370; --line:#D3D9E0;
  --blue:#1B44C4; --on-blue:#FFFFFF; --blue-tint:#E1E8FA;
  --green:#14783F; --on-green:#FFFFFF; --green-tint:#D9F0E2;
  --yellow:#F2B400; --on-yellow:#2B2000; --yellow-tint:#FAEEC4; --yellow-d:#7A5700;
  --red:#C02A27; --on-red:#FFFFFF; --red-tint:#F8DEDD;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1115; --surface:#161B21; --ink:#E8ECF0; --muted:#8D98A5; --line:#28313A;
    --blue:#86A2FF; --on-blue:#0A1026; --blue-tint:#192346;
    --green:#4CC48A; --on-green:#06210F; --green-tint:#12332A;
    --yellow:#F5C73D; --on-yellow:#2B2000; --yellow-tint:#3A2F0B; --yellow-d:#F5C73D;
    --red:#FF7670; --on-red:#2A0606; --red-tint:#3A1817;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#161B21; --ink:#E8ECF0; --muted:#8D98A5; --line:#28313A;
  --blue:#86A2FF; --on-blue:#0A1026; --blue-tint:#192346;
  --green:#4CC48A; --on-green:#06210F; --green-tint:#12332A;
  --yellow:#F5C73D; --on-yellow:#2B2000; --yellow-tint:#3A2F0B; --yellow-d:#F5C73D;
  --red:#FF7670; --on-red:#2A0606; --red-tint:#3A1817;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.locked{overflow:hidden}
#app{max-width:640px;margin:0 auto;padding-bottom:40px}
body.hasnav #app{padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
#main{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0}
h1{font:800 40px/0.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font:800 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
h3{font:700 16px/1.2 var(--f-body)}
.kicker{font:600 11.5px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .ctr{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.top h1{margin-top:4px}
.row{display:flex;align-items:center}.row.between{justify-content:space-between;gap:12px}.row.gap{gap:10px}.row.tight{gap:0}.wrapr{flex-wrap:wrap}
.col{display:flex;flex-direction:column}.col.gap{gap:10px}.grow{flex:1}
.spacer{height:24px}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk>h2{padding-top:10px;border-top:2px solid var(--ink)}
.blk.next{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:14px}
.blk.next>h2,.blk.week>h2{border:0;padding:0}
.blk.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.blk.next h2{font-size:30px}
.empty{padding:20px 4px;color:var(--muted)} .empty.big{padding:36px 8px;text-align:center;font-size:16px} .empty.small{padding:24px 4px;text-align:center}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--muted)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

/* buttons and controls */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border:2px solid var(--blue);border-radius:8px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:15px;letter-spacing:.02em}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);min-height:40px}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.danger-o{background:transparent;border-color:var(--red);color:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:none;color:var(--ink);border-radius:8px;flex:none}
.ic{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chipb{flex:none;min-height:36px;padding:0 14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);font-weight:600;font-size:13.5px}
.chipb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.search,.txt,textarea,select,.num{font:400 16px/1.3 var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px}
.search,.txt{width:100%;min-height:44px;padding:0 12px}
.txt.big{font:800 24px var(--f-display);text-transform:uppercase}
textarea{width:100%;padding:10px 12px;resize:vertical}
textarea.mono{font:400 12.5px/1.4 var(--f-mono)}
select{min-height:44px;padding:0 10px;max-width:100%}
.sel{display:block}.sel.wide select{width:100%}
.num{font-family:var(--f-mono);font-weight:500;text-align:center;width:100%;min-height:40px;padding:0 4px;min-width:0}
.lbl{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-6px}
.chk-l{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.chk-l input{width:20px;height:20px;accent-color:var(--blue)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow>span{display:flex;flex-direction:column;min-width:0}.trow small{color:var(--muted);font-size:12.5px;margin-top:1px}
.trow .num,.trow .txt{width:96px;flex:none}.trow .txt{width:150px;text-align:right}
.trow select{width:96px}
input.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;border:0;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
input.sw:checked{background:var(--green)}input.sw:checked::after{transform:translateX(20px)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fields.three{grid-template-columns:1.4fr 1fr .8fr}.fields.two{grid-template-columns:1fr 1fr}.fields.mf{grid-template-columns:repeat(3,1fr)}
.fields select,.fields .txt{width:100%}

/* tab content */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border:2px solid var(--green);border-radius:10px;background:var(--green-tint);text-align:left}
.banner span:first-child{display:flex;flex-direction:column}.banner small{color:var(--muted);font-variant-numeric:tabular-nums}
.banner .go{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--green)}
.week .big{font:800 54px/1 var(--f-display)}.week .of{font-size:16px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--yellow-d)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--f-body);color:var(--muted)}
.wd i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);font-style:normal}
.wd.on i{background:var(--green);border-color:var(--green);color:var(--on-green)}
.wd.today i{border:2px solid var(--ink)}.wd.today{color:var(--ink)}
.plan{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.plan li span{flex:1;font-weight:500;min-width:0}.plan small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.plan em{font:600 12px var(--f-mono);font-style:normal;color:var(--muted)}.plan em.up{color:var(--green);font-weight:700}
.upnote{display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;color:var(--green);font-weight:600}
.folder h3{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 0}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.lrow.sel{background:var(--blue-tint)}
.lr-main{display:flex;flex-direction:column;min-width:0;flex:1;text-align:left}
button.lr-main{background:none;border:0;padding:0}
.lr-main b{font-weight:600;font-size:16px}.lr-main small{color:var(--muted);font-size:13px}
.lr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--muted);font-size:12.5px;flex:none}
.lrow.rr{cursor:default;padding-right:0}
.wc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.wc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.wc-h b{font:800 19px var(--f-display);text-transform:uppercase;letter-spacing:.02em}.wc-h small{color:var(--muted)}
.wc-s{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 6px;font:500 12.5px var(--f-mono);color:var(--muted)}
.wc-l{list-style:none;margin:0;padding:0}.wc-l li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.wc-l small{color:var(--muted);font-family:var(--f-mono);font-size:12px}.wc-l .more{color:var(--muted)}
.prb{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;background:var(--yellow);color:var(--on-yellow);font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.05em}
.mh{display:flex;align-items:baseline;justify-content:space-between;font:800 18px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 8px;padding-top:8px;border-top:2px solid var(--ink)}
.mh small{font:500 12px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.calh{display:flex;align-items:center;justify-content:space-between}.calh b{font:800 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calw span{text-align:center;font:600 11px var(--f-body);color:var(--muted)}
.calg i{display:block}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0;font-size:13px;font-variant-numeric:tabular-nums}
.cd span{position:absolute;top:4px;left:6px}.cd b{position:absolute;bottom:3px;right:6px;font-size:11px;color:var(--green)}
.cd.has{background:var(--green-tint);border-color:var(--green)}.cd.today{border:2px solid var(--ink)}.cd.sel{outline:2px solid var(--blue);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.tiles div{display:flex;flex-direction:column;padding:10px 4px;min-width:0}
.tiles b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}.tiles span{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:3px}
.mrow{display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:8px;font-size:14px}
.mrow.zero{color:var(--muted)}.mrow b{text-align:right;font:500 13px var(--f-mono)}.mrow small{color:var(--muted)}
.mbar{display:flex;height:12px;background:var(--line);border-radius:3px;overflow:hidden}.mbar .p{background:var(--blue)}.mbar .s{background:var(--blue);opacity:.38}
.chart{display:flex;flex-direction:column;gap:2px;touch-action:pan-y}
.ro{font:500 14px var(--f-mono);min-height:20px}
.svgc{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}.ax{fill:var(--muted);font:10px var(--f-mono)}
.ln{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.ar{fill:var(--blue);opacity:.13}
.dt{fill:var(--blue)}.hl{fill:var(--surface);stroke:var(--blue);stroke-width:2.6}
.bar{fill:var(--blue)}.bar.hit{fill:var(--green)}.bar.now{fill:var(--ink)}.bv{fill:var(--muted);font:9px var(--f-mono)}
.goal{stroke:var(--green);stroke-width:1.6;stroke-dasharray:4 3}

/* nav, rest bar, toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nb{position:relative;flex:1;max-width:128px;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:600 11px var(--f-body)}
.nb.on{color:var(--ink)}.nb.on::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--blue)}
.nb .dot{position:absolute;top:9px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.rest{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.28)}
body.hasnav .rest{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))}
.rest-p{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--yellow)}
.rest-l{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.09em;opacity:.75}
.rest b{flex:1;font:500 24px var(--f-mono);font-variant-numeric:tabular-nums}
.rb{min-height:38px;min-width:48px;padding:0 10px;border:1.5px solid color-mix(in srgb,var(--bg) 45%,transparent);border-radius:8px;background:transparent;color:var(--bg);font-weight:700;font-size:14px}
.rb.skip{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:80;max-width:min(520px,calc(100% - 24px));padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{transform:translate(-50%,0);opacity:1}.toast.pr{background:var(--yellow);color:var(--on-yellow)}.toast.bad{background:var(--red);color:var(--on-red)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* full-screen screens */
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.topbar{position:sticky;top:0;z-index:5;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:2px solid var(--ink)}
.tb-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.tb-clock{font:800 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.title-in{width:100%;font:800 30px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;background:none;border:0;border-bottom:2px solid var(--line);padding:4px 0;color:var(--ink);border-radius:0}
.rnote{font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}.rnote summary{font-weight:600;cursor:pointer}.rnote p{margin:8px 0 2px;color:var(--muted)}
.exb{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--ink);padding-top:10px}
.exb.linked+.exb{border-top:1px dashed var(--muted)}
.exh{display:flex;align-items:flex-start;gap:8px}
.exi{font:600 12px var(--f-mono);color:var(--muted);padding-top:8px;min-width:20px}
.exn{flex:1;min-width:0}
.exname{display:block;max-width:100%;padding:2px 0;border:0;background:none;text-align:left;font:800 23px/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
.exname.static{cursor:default}
.exm{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.ssb{padding:0 6px;border-radius:4px;background:var(--blue-tint);color:var(--ink);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.hint{padding:7px 10px;border-radius:6px;background:var(--blue-tint);font-size:13.5px}
.hint.up{background:var(--green-tint);font-weight:600}.hint.hold{background:var(--yellow-tint)}
.exnote{min-height:0}
.cue{display:block;width:100%;text-align:left;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;background:transparent;font-size:13.5px;color:var(--muted)}
.sets{display:flex;flex-direction:column}
.srow{display:grid;align-items:center;gap:4px;min-height:48px;padding:3px 4px;border-radius:6px}
.srow.head{min-height:22px;font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center}
.srow.head span:nth-child(2){text-align:center}

function setVol(ex,s){if(ex.ty==='wr')return (s.w||0)*(s.r||0)*(ex.du?2:1);if(ex.ty==='bwx')return (s.w||0)*(s.r||0)*(ex.du?2:1);return 0;}
function e1(w,r){if(!w||!r)return 0;if(r===1)return w;return r<=12?w*(1+r/30):0;}
function setScore(ex,s){if(ex.ty==='band'||ex.ty==='bwx')return (s.w||0)*1000+(s.r||0);if(ex.ty==='bw')return s.r||0;if(ex.ty==='dur')return s.s||0;return 0;}
function setTxt(ex,s){
  switch(ex.ty){
    case 'wr':return fw(s.w)+'×'+(s.r==null?'–':s.r);
    case 'bwx':return (s.w?'+'+fw(s.w):'BW')+'×'+(s.r==null?'–':s.r);
    case 'bw':return (s.r==null?'–':s.r)+' reps';
    case 'dur':return (s.s==null?'–':s.s)+' s';
    case 'band':return 'L'+fw(s.w)+'×'+(s.r==null?'–':s.r);
  }
  return '';
}
const lastOf=(xid,exclId)=>(S.idx[xid]||[]).find(e=>e.w.id!==exclId);

function records(xid,exclId){
  const R={n:0,w:0,e1:0,sv:0,sess:0,score:0};
  (S.idx[xid]||[]).forEach(o=>{
    if(o.w.id===exclId)return;
    let sv=0,any=false;const ex=o.ex;
    ex.sets.forEach(s=>{
      if(!isWork(s))return;any=true;
      if(ex.ty==='wr'){R.w=Math.max(R.w,s.w||0);R.e1=Math.max(R.e1,e1(s.w,s.r));const v=setVol(ex,s);R.sv=Math.max(R.sv,v);sv+=v;}
      R.score=Math.max(R.score,setScore(ex,s));
    });
    if(any){R.n++;R.sess=Math.max(R.sess,sv);}
  });
  return R;
}
function recomputePRs(w){
  (w.exs||[]).forEach(ex=>{
    const b=records(ex.xid,w.id);const run=Object.assign({},b);
    ex.sets.forEach(s=>{
      s.pr=[];
      if(!isWork(s)||!b.n)return;
      if(ex.ty==='wr'){
        if((s.w||0)>run.w)s.pr.push('W');
        const e=e1(s.w,s.r);if(e>run.e1+1e-9)s.pr.push('E');
        const v=setVol(ex,s);if(v>run.sv)s.pr.push('V');
        run.w=Math.max(run.w,s.w||0);run.e1=Math.max(run.e1,e);run.sv=Math.max(run.sv,v);
      }else{
        const sc=setScore(ex,s);if(sc>run.score)s.pr.push('S');
        run.score=Math.max(run.score,sc);
      }
    });
  });
}
const PRL={W:'Heaviest weight',E:'Est. 1RM',V:'Set volume',S:'Best set'};
function summarize(w){
  let vol=0,n=0,reps=0,prs=0;const spr=[];
  w.exs.forEach(ex=>{
    let sv=0;
    ex.sets.forEach(s=>{if(!s.done||s.t==='w')return;n++;reps+=(s.r||0);const v=setVol(ex,s);vol+=v;sv+=v;if(s.pr&&s.pr.length)prs++;});
    if(ex.ty==='wr'&&sv>0){const rc=records(ex.xid,w.id);if(rc.n&&sv>rc.sess)spr.push(ex.xid);}
  });
  w.vol=vol;w.nsets=n;w.reps=reps;w.prs=prs;w.spr=spr;
  w.dur=Math.max(0,Math.round(((w.end||w.start)-w.start)/1000));
  return w;
}

/* ===== progression suggestion (double progression) ===== */
function suggest(d,spec,exclId){
  const last=lastOf(d.id,exclId);
  if(!last)return {kind:'first',text:''};
  const work=last.ex.sets.filter(s=>s.done&&s.t==='n');
  if(!work.length)return {kind:'first',text:''};
  const ty=d.type,rmin=spec.rmin||0,rmax=spec.rmax||0,inc=incOf(d);
  const val=s=>ty==='dur'?(s.s||0):(s.r||0);
  const step=ty==='dur'?5:1;
  const topW=Math.max.apply(null,work.map(s=>s.w||0));
  const maxRpe=Math.max.apply(null,[0].concat(work.map(s=>s.rpe||0)));
  const hitAll=rmax>0&&work.length>=(spec.sets||1)&&work.every(s=>val(s)>=rmax);
  const unit=S.settings.units;
  const build=work.map(s=>rmax?Math.min(rmax,Math.max(val(s)+step,rmin||0)):val(s));
  while(spec.sets&&build.length<spec.sets)build.push(build.length?build[build.length-1]:(rmin||null));
  if(hitAll){
    if(maxRpe>=10)return {kind:'hold',w:topW,targets:work.map(s=>val(s)),text:'Last time ended at RPE 10. Repeat '+fw(topW)+' '+unit+' and keep 1–2 reps in reserve.'};
    if(ty==='wr'||ty==='bwx'){const nw=Math.round((topW+inc)*10)/10;return {kind:'up',w:nw,targets:work.map(()=>rmin||null),text:'Top of the range on every set. Add weight: '+fw(nw)+' '+unit+'.'};}
    if(ty==='band'&&!topW)return {kind:'up',w:null,targets:work.map(()=>rmin||null),text:'Top of the range on every set. Move up to a heavier band.'};
    if(ty==='band')return {kind:'up',w:topW+1,targets:work.map(()=>rmin||null),text:'Top of the range on every set. Go up a band level: L'+fw(topW+1)+'.'};
    if(ty==='dur')return {kind:'up',w:null,targets:work.map(s=>val(s)+step),text:'Held the full time on every set. Add 5 seconds.'};
    return {kind:'up',w:null,targets:work.map(()=>rmin||null),text:'Top of the range on every set. Slow the tempo, add a pause, or move to a harder variation.'};
  }
  const parts=work.map(val).join(', ');
  const wtxt=(ty==='wr'||ty==='bwx')&&topW?fw(topW)+' '+unit+' · ':(ty==='band'&&topW?'L'+fw(topW)+' · ':'');
  return {kind:'build',w:topW,ws:work.map(s=>s.w||0),targets:build,text:'Last: '+wtxt+parts+(rmax?'. Beat it, up to '+rmax+'.':'.')};
}

function mkEx(d,spec){
  spec=spec||{};

  const sug=suggest(d,{sets:n,rmin:spec.rmin||0,rmax:spec.rmax||0},null);
  const noW=d.type==='bw'||d.type==='dur';
  const ex={xid:d.id,name:d.name,ty:d.type,du:!!d.dual,un:!!d.uni,mu:d.muscle,se:d.sec||[],note:spec.note||'',ss:spec.ss||null,rest:spec.rest==null?null:spec.rest,rmin:spec.rmin||0,rmax:spec.rmax||0,hint:sug.text||'',hk:sug.kind||'',sets:[]};
  for(let i=0;i<n;i++){
    const tg=sug.targets&&sug.targets[i]!=null?sug.targets[i]:(spec.rmax||null);
    const lw=(sug.kind==='build'&&sug.ws&&sug.ws.length)?(sug.ws[i]!=null?sug.ws[i]:sug.ws[sug.ws.length-1]):sug.w;
    ex.sets.push({t:'n',w:(!noW&&lw!=null&&lw!==0)?lw:null,r:null,s:null,rpe:null,done:false,ph:tg});

}
function newCur(title,routineId){return {id:rid('w'),title:title||'',routineId:routineId||null,start:Date.now(),end:null,notes:'',exs:[]};}
function normSS(exs){
  const cnt={};exs.forEach(e=>{if(e.ss)cnt[e.ss]=(cnt[e.ss]||0)+1;});
  exs.forEach((e,i)=>{if(!e.ss)return;const a=exs[i-1],b=exs[i+1];const adj=(a&&a.ss===e.ss)||(b&&b.ss===e.ss);if(!adj)e.ss=null;});
}
function linkNext(exs,i){
  const a=exs[i],b=exs[i+1];if(!a||!b)return;
  const nid=()=>Math.floor(Math.random()*1e6)+1;
  if(a.ss&&a.ss===b.ss){
    const g=a.ss,fresh=nid();
    for(let j=i+1;j<exs.length&&exs[j].ss===g;j++)exs[j].ss=fresh;
  }else{
    const g=a.ss||nid(),old=b.ss;
    a.ss=g;
    if(old){for(let j=i+1;j<exs.length&&exs[j].ss===old;j++)exs[j].ss=g;}else b.ss=g;
  }
  normSS(exs);
}

/* Add defaults once to existing installations without overwriting custom routines/history.
   Migration marker prevents deleted defaults from reappearing after refresh. */
function ensureFullBodyRoutines(ro){
  if(ro&&ro.fullBody20261121)return false;
  const fresh=seedRoutines();
  const names=new Set(S.routines.map(x=>x.id));
  const add=fresh.filter(x=>!names.has(x.id));
  S.routines=add.concat(S.routines);
  Store.save('routines',{list:S.routines,seeded:true,fullBody20261121:true},0);
  return true;
}
function nextRoutine(){
  const pool=S.routines.filter(r=>r.id===FULL_BODY_A||r.id===FULL_BODY_B);
  if(pool.length){
    const latest=S.sorted.find(w=>pool.some(r=>r.id===w.routineId));
    if(!latest)return pool.find(r=>r.id===FULL_BODY_A)||pool[0];
    return pool.find(r=>r.id!==latest.routineId)||pool[0];
  }
  if(!S.routines.length)return null;
  const lastW=S.sorted.find(w=>w.routineId&&S.routines.some(r=>r.id===w.routineId));
  if(!lastW)return S.routines[0];
  const lr=S.routines.find(r=>r.id===lastW.routineId);
  const same=S.routines.filter(r=>(r.folder||'')===(lr.folder||''));
  return same[(same.findIndex(r=>r.id===lr.id)+1)%same.length];
}
function weekStreak(){
  const g=S.settings.goal||1,by={};
  S.workouts.forEach(w=>{const k=weekStart(w.start);by[k]=(by[k]||0)+1;});
  let k=weekStart(Date.now()),n=0;
  if((by[k]||0)>=g)n++;
  k=addDays(k,-7);
  while((by[k]||0)>=g){n++;k=addDays(k,-7);}
  return n;
}
function exSeries(xid,metric,range){
  const out=[];const cut=range?Date.now()-range*DAY:0;
  (S.idx[xid]||[]).slice().reverse().forEach(o=>{
    if(o.w.start<cut)return;
    const ex=o.ex;let best=0,sum=0,any=false;
    ex.sets.forEach(s=>{
      if(!isWork(s))return;any=true;
      let v=0;
      switch(metric){
        case 'e1':v=e1(s.w,s.r);break;
        case 'w':v=s.w||0;break;
        case 'sv':v=setVol(ex,s);break;
        case 'vol':v=setVol(ex,s);break;
        case 'r':v=s.r||0;break;
        case 'reps':v=s.r||0;break;
        case 's':v=s.s||0;break;
        case 'tot':v=s.s||0;break;
      }
      best=Math.max(best,v);sum+=v;
    });
    if(!any)return;
    const y=(metric==='vol'||metric==='reps'||metric==='tot')?sum:best;
    if(y>0)out.push({x:o.w.start,y:Math.round(y*10)/10});
  });
  return out;
}

const CH={};
function niceTicks(min,max,n){
  if(!(max>min)){min=min-1;max=max+1;}
  const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);
  return t;
}

const chip=(act,v,label,on,extra)=>'<button class="chipb'+(on?' on':'')+'" data-act="'+act+'" data-v="'+esc(v)+'" '+(extra||'')+' aria-pressed="'+(!!on)+'">'+esc(label)+'</button>';
function repText(d,spec){const a=spec.rmin,b=spec.rmax;const r=a===b?String(b):a+'–'+b;return d&&d.type==='dur'?r+' s':r;}
function wtag(d,sg){
  if(!d||sg.w==null)return '';
  if(d.type==='wr'||d.type==='bwx')return sg.w?fw(sg.w)+' '+unit():'';
  if(d.type==='band')return 'L'+fw(sg.w);
  return '';
}
function bestSet(ex){
  let best=null,bs=-1;
  ex.sets.forEach(s=>{if(s.t==='w')return;const sc=ex.ty==='wr'?(s.w||0)*1000+(s.r||0):setScore(ex,s);if(sc>bs){bs=sc;best=s;}});
  return best?setTxt(ex,best):'';
}
function wcard(w){
  const top=w.exs.slice(0,4).map(ex=>'<li><span>'+esc(ex.name)+'</span><small>'+ex.sets.filter(s=>s.t!=='w').length+' × '+esc(bestSet(ex))+'</small></li>').join('');
  return '<button class="wc" data-act="wopen" data-id="'+w.id+'"><div class="wc-h"><b>'+esc(w.title||'Workout')+'</b><small>'+dShort(w.start)+' · '+hm(w.start)+'</small></div><div class="wc-s"><span>'+fmtDur(w.dur)+'</span>'+(w.vol?'<span>'+fmtV(w.vol)+' '+unit()+'</span>':'')+'<span>'+w.nsets+' sets</span>'+(w.prs?'<span class="prb">'+ic('trophy',13)+' '+w.prs+' PR</span>':'')+'</div><ul class="wc-l">'+top+(w.exs.length>4?'<li class="more">+'+(w.exs.length-4)+' more</li>':'')+'</ul></button>';
}
function navView(){
  const t=[['home','Train','bell'],['history','History','hist'],['exercises','Exercises','list'],['stats','Progress','chart'],['me','Settings','gear']];
  return t.map(a=>'<button class="nb'+(S.tab===a[0]?' on':'')+'" data-act="tab" data-v="'+a[0]+'" aria-current="'+(S.tab===a[0]?'page':'false')+'">'+ic(a[2],22)+'<span>'+a[1]+'</span>'+(a[0]==='home'&&S.cur&&S.curNew?'<i class="dot"></i>':'')+'</button>').join('');
}
function filteredEx(f,byUse){
  const q=(f.q||'').trim().toLowerCase();
  const cnt=id=>(S.idx[id]||[]).length;
  let l=exList().filter(d=>(f.arch||!d.arch)&&(!f.m||d.muscle===f.m)&&(!f.e||d.equip===f.e)&&(!q||(d.name+' '+d.muscle+' '+d.equip).toLowerCase().includes(q)));
  l.sort((a,b)=>byUse&&cnt(b.id)!==cnt(a.id)?cnt(b.id)-cnt(a.id):a.name.localeCompare(b.name));
  return l;
}
function exRowHTML(d,act,sel){
  const last=(S.idx[d.id]||[])[0];
  return '<button class="lrow'+(sel?' sel':'')+'" data-act="'+act+'" data-id="'+d.id+'"><span class="lr-main"><b>'+esc(d.name)+'</b><small>'+esc([d.muscle,d.equip].filter(Boolean).join(' · '))+(d.custom?' · custom':'')+(d.arch?' · archived':'')+'</small></span><span class="lr-side">'+(sel?ic('check',18):(last?'<small>'+dMon(last.w.start)+'</small>':''))+'</span></button>';
}
function exListHTML(act,f,byUse,selIds){
  const l=filteredEx(f,byUse);
  if(!l.length)return '<div class="empty">No exercise matches. Try a different search, or create your own.</div>';
  return l.map(d=>exRowHTML(d,act,selIds&&selIds.indexOf(d.id)>=0)).join('');
}
function filterBar(f,pathBase,actM){
  return '<div class="chips" role="group" aria-label="Muscle group">'+chip(actM,'','All',!f.m)+MUSCLES.filter(m=>m!=='Other').map(m=>chip(actM,m,m,f.m===m)).join('')+'</div>'
   +'<div class="row gap wrapr"><label class="sel"><span class="sr">Equipment</span><select data-in="'+pathBase+'.e"><option value="">All equipment</option>'+EQUIP.map(e=>'<option'+(f.e===e?' selected':'')+'>'+e+'</option>').join('')+'</select></label></div>';
}

/* ================= tab views ================= */
function tabView(){
  switch(S.tab){
    case 'history':return historyView();
    case 'exercises':return exercisesView();
    case 'stats':return statsView();
    case 'me':return meView();
  }
  return homeView();
}
function loadingView(){return '<div class="loading"><div class="spin"></div><p>Opening your log…</p></div>';}

function homeView(){
  const now=Date.now(),wk=weekStart(now),tw=S.workouts.filter(w=>w.start>=wk),goal=S.settings.goal||3,streak=weekStreak();
  const days=[0,1,2,3,4,5,6].map(i=>{const d=addDays(wk,i);const n=tw.filter(w=>startOfDay(w.start)===d).length;return '<div class="wd'+(n?' on':'')+(d===startOfDay(now)?' today':'')+'"><i>'+(n?ic('check',13):'')+'</i><span>'+'MTWTFSS'[i]+'</span></div>';}).join('');
  const banner=S.cur&&S.curNew?'<button class="banner" data-act="resume"><span><b>Workout in progress</b><small id="bn-clock">'+clock((now-S.cur.start)/1000)+' · '+esc(S.cur.title||'Untitled')+'</small></span><span class="go">Resume '+ic('right',16)+'</span></button>':'';
  const nr=nextRoutine();
  let next='';
  if(nr){
    const last=S.sorted.find(w=>w.routineId===nr.id);
    let ups=0;
    const lines=nr.exs.map(spec=>{
      const d=exOf(spec.xid);if(!d)return '';
      const sg=suggest(d,spec,null);if(sg.kind==='up')ups++;
      const tag=sg.kind==='up'?'<em class="up">↑ '+(wtag(d,sg)||'progress')+'</em>':(sg.kind==='build'&&wtag(d,sg)?'<em>'+wtag(d,sg)+'</em>':'');
      return '<li><span>'+esc(d.name)+'</span><small>'+spec.sets+'×'+repText(d,spec)+'</small>'+tag+'</li>';
    }).join('');
    next='<section class="blk next"><div class="kicker">Up next'+(last?' · last done '+dMon(last.start):'')+'</div><div class="row between"><h2>'+esc(nr.name)+'</h2><button class="btn" data-act="rstart" data-id="'+nr.id+'">'+(S.cur&&S.curNew?'Resume':'Start')+'</button></div>'
      +(ups?'<p class="upnote">'+ic('flame',15)+' '+ups+' exercise'+(ups>1?'s':'')+' ready for more weight or a harder variation.</p>':'')
      +'<ul class="plan">'+lines+'</ul></section>';
  }
  const groups={};S.routines.forEach(r=>{const k=r.folder||'Routines';(groups[k]=groups[k]||[]).push(r);});
  const rl=Object.keys(groups).map(f=>'<div class="folder"><h3>'+esc(f)+'</h3>'+groups[f].map(r=>{
    const last=S.sorted.find(w=>w.routineId===r.id);
    return '<div class="lrow rr"><button class="lr-main" data-act="redit" data-id="'+r.id+'"><b>'+esc(r.name)+'</b><small>'+r.exs.length+' exercises · ~'+estMin(r)+' min'+(last?' · '+dMon(last.start):'')+'</small></button><button class="btn sm sec" data-act="rstart" data-id="'+r.id+'">Start</button><button class="iconbtn" data-act="rmenu" data-id="'+r.id+'" aria-label="Routine options">'+ic('more')+'</button></div>';
  }).join('')+'</div>').join('');
  const recent=S.sorted.slice(0,3).map(wcard).join('');
  return '<header class="top"><div><div class="kicker">'+dLong(now)+'</div><h1>Iron Ledger</h1></div></header>'+banner
   +'<section class="blk week"><div class="row between"><div><span class="big">'+tw.length+'</span><span class="of"> of '+goal+' this week</span></div>'+(streak?'<span class="streak">'+ic('flame',15)+' '+streak+' week streak</span>':'<span class="muted small">Streak starts at '+goal+' a week</span>')+'</div><div class="wdays">'+days+'</div></section>'
   +next
   +'<div class="row gap"><button class="btn sec grow" data-act="startempty">'+ic('plus',18)+' Empty workout</button><button class="btn sec grow" data-act="rnew">'+ic('plus',18)+' New routine</button></div>'
   +'<section class="blk"><h2>Routines</h2>'+(rl||'<p class="muted">No routines yet.</p>')+'</section>'
   +(recent?'<section class="blk"><h2>Recent</h2>'+recent+'</section>':'');
}

function historyView(){
  const h=S.hist;
  const seg='<div class="seg" role="group" aria-label="View"><button class="'+(h.mode==='list'?'on':'')+'" data-act="hmode" data-v="list">List</button><button class="'+(h.mode==='cal'?'on':'')+'" data-act="hmode" data-v="cal">Calendar</button></div>';
  let body='';
  if(!S.wLoaded)body='<div class="loading"><div class="spin"></div></div>';
  else if(!S.workouts.length)body='<div class="empty big">No workouts yet. Finish one and it shows up here, with your records.</div>';
  else if(h.mode==='cal')body=calView();
  else{
    let cur='';const items=S.sorted.slice(0,h.limit);
    body=items.map(w=>{const d=new Date(w.start),m=MON[d.getMonth()]+' '+d.getFullYear();let head='';if(m!==cur){cur=m;const n=S.workouts.filter(x=>{const e=new Date(x.start);return e.getMonth()===d.getMonth()&&e.getFullYear()===d.getFullYear();}).length;head='<h3 class="mh">'+m+'<small>'+n+' workout'+(n>1?'s':'')+'</small></h3>';}return head+wcard(w);}).join('');
    if(S.sorted.length>h.limit)body+='<button class="btn sec wide" data-act="hmore">Show more</button>';
  }
  return '<header class="top"><div><div class="kicker">'+S.workouts.length+' logged</div><h1>History</h1></div>'+seg+'</header>'+body;
}
function calView(){
  const h=S.hist,n=new Date();
  const m0=h.month||new Date(n.getFullYear(),n.getMonth(),1).getTime();
  const d0=new Date(m0),y=d0.getFullYear(),m=d0.getMonth();
  const lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const by={};S.workouts.forEach(w=>{const k=ymd(w.start);(by[k]=by[k]||[]).push(w);});
  let cells='';for(let i=0;i<lead;i++)cells+='<i></i>';
  let monthN=0;
  for(let d=1;d<=dim;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d),c=(by[k]||[]).length;monthN+=c;
    cells+='<button class="cd'+(c?' has':'')+(h.day===k?' sel':'')+(k===ymd(Date.now())?' today':'')+'" data-act="hday" data-v="'+k+'" '+(c?'':'tabindex="-1"')+'><span>'+d+'</span>'+(c?'<b>'+c+'</b>':'')+'</button>';
  }
  const sel=h.day&&by[h.day]?'<h3 class="mh">'+dLong(parseDT(h.day,'12:00'))+'</h3>'+by[h.day].map(wcard).join(''):'';
  return '<div class="calh"><button class="iconbtn" data-act="hmonth" data-v="-1" aria-label="Previous month">'+ic('left')+'</button><b>'+MON[m]+' '+y+'</b><button class="iconbtn" data-act="hmonth" data-v="1" aria-label="Next month">'+ic('right')+'</button></div><div class="calw">'+['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="calg">'+cells+'</div><p class="muted small ctr">'+monthN+' workout'+(monthN===1?'':'s')+' this month</p>'+sel;
}

function exercisesView(){
  const e=S.ex;
  return '<header class="top"><div><div class="kicker">'+exList().filter(x=>!x.arch).length+' available</div><h1>Exercises</h1></div><button class="btn sm" data-act="exnew">'+ic('plus',16)+' New</button></header>'
   +'<input class="search" type="search" id="ex-q" data-in="ex.q" placeholder="Search exercises" value="'+esc(e.q)+'" aria-label="Search exercises" autocomplete="off">'
   +filterBar(e,'ex','exm')
   +'<label class="chk-l"><input type="checkbox" data-in="ex.arch"'+(e.arch?' checked':'')+'> Show archived</label>'
   +'<div id="ex-list" class="list">'+exListHTML('exdetail',e,false)+'</div>';
}

function weekBuckets(n){
  const w0=weekStart(Date.now()),out=[];
  for(let i=n-1;i>=0;i--){const s=addDays(w0,-7*i),e=addDays(s,7);const ws=S.workouts.filter(w=>w.start>=s&&w.start<e);out.push({s:s,n:ws.length,v:ws.reduce((a,w)=>a+(w.vol||0),0)});}
  return out;
}
function statsView(){
  const st=S.st,cut=st.range?Date.now()-st.range*DAY:0,ws=S.workouts.filter(w=>w.start>=cut);
  const tot=ws.reduce((a,w)=>({n:a.n+1,vol:a.vol+(w.vol||0),sets:a.sets+(w.nsets||0),t:a.t+(w.dur||0)}),{n:0,vol:0,sets:0,t:0});
  const rng=[[30,'30 days'],[90,'90 days'],[365,'1 year'],[0,'All time']].map(a=>chip('strange',a[0],a[1],st.range===a[0])).join('');
  if(!S.wLoaded)return '<header class="top"><div><div class="kicker">Trends</div><h1>Progress</h1></div></header><div class="loading"><div class="spin"></div></div>';
  if(!S.workouts.length)return '<header class="top"><div><div class="kicker">Trends</div><h1>Progress</h1></div></header><div class="empty big">Charts appear after your first saved workout.</div>'+bodyBlock();
  const wb=weekBuckets(12),goal=S.settings.goal||3;
  const wbars=wb.map((b,i)=>({label:dMon(b.s),v:b.n,cls:b.n>=goal?'hit':(i===11?'now':'')}));
  const vbars=wb.map((b,i)=>({label:dMon(b.s),v:b.v,cls:i===11?'now':''}));
  /* muscle sets */
  const pri={},sec={};
  ws.forEach(w=>w.exs.forEach(ex=>{const n=ex.sets.filter(s=>s.done&&s.t!=='w').length;if(!n)return;const d=exOf(ex.xid);const m=ex.mu||(d&&d.muscle)||'Other';pri[m]=(pri[m]||0)+n;(ex.se||(d&&d.sec)||[]).forEach(x=>{sec[x]=(sec[x]||0)+n;});}));
  const mus=MUSCLES.filter(m=>(m!=='Full body'&&m!=='Other')||pri[m]||sec[m]);
  const mx=Math.max.apply(null,[1].concat(mus.map(m=>(pri[m]||0)+(sec[m]||0))));
  const mrows=mus.map(m=>{const p=pri[m]||0,s=sec[m]||0;return '<div class="mrow'+(p+s?'':' zero')+'"><span>'+m+'</span><div class="mbar"><i class="p" style="width:'+(p/mx*100).toFixed(1)+'%"></i><i class="s" style="width:'+(s/mx*100).toFixed(1)+'%"></i></div><b>'+p+(s?'<small> +'+s+'</small>':'')+'</b></div>';}).join('');
  /* strength */
  const done=Object.keys(S.idx).filter(id=>S.idx[id].length).sort((a,b)=>S.idx[b].length-S.idx[a].length);
  if(!st.xid||!S.idx[st.xid])st.xid=done[0]||'';
  const d=exOf(st.xid)||{type:(S.idx[st.xid]&&S.idx[st.xid][0].ex.ty)||'wr',name:st.xid};
  const ml=METRICS[d.type]||METRICS.wr;
  if(!ml.some(m=>m[0]===st.metric))st.metric=ml[0][0];
  const nameOf=id=>{const x=exOf(id);return x?x.name:(S.idx[id][0].ex.name);};
  const opts=done.map(id=>'<option value="'+id+'"'+(id===st.xid?' selected':'')+'>'+esc(nameOf(id))+'</option>').join('');
  const xr=[[90,'3M'],[180,'6M'],[365,'1Y'],[0,'All']].map(a=>chip('stxr',a[0],a[1],st.xr===a[0])).join('');
  const series=exSeries(st.xid,st.metric,st.xr);
  const strength='<section class="blk"><h2>Lift trend</h2><label class="sel wide"><span class="sr">Exercise</span><select data-in="st.xid" data-re="1">'+opts+'</select></label><div class="chips">'+ml.map(m=>chip('stm',m[0],m[1],st.metric===m[0])).join('')+'</div>'+lineChart('st',series,{fmt:metricFmt(st.metric),zero:/vol|reps|tot/.test(st.metric)})+'<div class="chips">'+xr+'</div></section>';
  /* pr feed */
  const feed=[];
  for(const w of S.sorted){for(const ex of w.exs){const s=ex.sets.filter(s=>s.pr&&s.pr.length).pop();if(s)feed.push({w:w,ex:ex,s:s});}if(feed.length>=8)break;}
  const prh=feed.length?'<section class="blk"><h2>Recent records</h2>'+feed.map(f=>'<button class="lrow" data-act="wopen" data-id="'+f.w.id+'"><span class="lr-main"><b>'+esc(f.ex.name)+'</b><small>'+esc(setTxt(f.ex,f.s))+' · '+[...new Set(f.s.pr.map(k=>PRL[k]))].join(', ')+'</small></span><span class="lr-side"><span class="prb">'+ic('trophy',13)+' PR</span><small>'+dMon(f.w.start)+'</small></span></button>').join('')+'</section>':'';
  return '<header class="top"><div><div class="kicker">Trends</div><h1>Progress</h1></div></header><div class="chips">'+rng+'</div>'
   +'<section class="tiles"><div><b>'+tot.n+'</b><span>workouts</span></div><div><b>'+fmtV(tot.vol)+'</b><span>'+unit()+' lifted</span></div><div><b>'+tot.sets+'</b><span>working sets</span></div><div><b>'+fmtDur(tot.t)+'</b><span>training time</span></div></section>'
   +'<section class="blk"><h2>Workouts per week</h2><p class="muted small">Green weeks met your goal of '+goal+'. Dashed line is the goal.</p>'+barChart(wbars,{goal:goal,label:'Workouts per week'})+'</section>'
   +'<section class="blk"><h2>Volume per week</h2>'+barChart(vbars,{fmt:v=>v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v)),label:'Volume per week'})+'</section>'
   +'<section class="blk"><h2>Sets per muscle group</h2><p class="muted small">Primary sets, plus sets where it assists.</p>'+mrows+'</section>'
   +strength+prh+bodyBlock();
}
function bodyBlock(){
  const e=S.body.entries.filter(x=>x.bw!=null).sort((a,b)=>a.t-b.t);
  const last=e[e.length-1];
  return '<section class="blk"><div class="row between"><h2>Body</h2><button class="btn sm sec" data-act="measopen">Measurements</button></div>'+(last?'<p class="muted small">Latest weight '+fw(last.bw)+' '+unit()+' on '+dMon(last.t)+'.</p>'+lineChart('bw0',e.map(x=>({x:x.t,y:x.bw})),{fmt:v=>fw(v)+' '+unit(),h:140}):'<p class="muted">Log your weight and measurements to chart them next to your lifts.</p>')+'</section>';
}

function estMin(r){
  let sec=0;(r.exs||[]).forEach(e=>{const rest=e.rest==null?S.settings.rest:e.rest;sec+=(e.sets||0)*(45+rest);});
  return Math.max(1,Math.round(sec/60/5)*5||5);
}
function syncLine(){
  if(S.cloudBlocked)return 'This view cannot save to your Claude account, which usually means the page was opened in Safari or another browser instead of the Claude app. Your log is saved in this browser only, and it is separate from the history in the Claude app.';
  if(S.mode!=='cloud')return 'Saved in this browser.';
  const de=Object.keys(Store.docErr).map(k=>k+' ('+Store.docErr[k]+')').join(', ');
  const pr=(de?'<br><small>Not saved to your account: '+esc(de)+'. It is kept on this phone.</small>':'')+(S.probeText?'<br><small>'+esc(S.probeText)+'</small>':'');
  const n=Store.npend();
  if(!n)return 'All workouts are synced. <button class="btn sec sm" data-act="checkcloud">Check cloud saving</button>'+pr;
  return n+' workout change'+(n===1?'':'s')+' saved on this phone, not synced yet'+(Store.lastErr?' ('+esc(Store.lastErr)+')':'')+'. <button class="btn sec sm" data-act="syncnow">Retry now</button> <button class="btn sec sm" data-act="checkcloud">Check cloud saving</button>'+pr;
}
function meView(){
  const s=S.settings;
  const tog=(p,label,on,hint)=>'<label class="trow"><span><b>'+label+'</b>'+(hint?'<small>'+hint+'</small>':'')+'</span><input type="checkbox" class="sw" data-in="'+p+'"'+(on?' checked':'')+'></label>';
  const numf=(p,label,v,hint,step)=>'<label class="trow"><span><b>'+label+'</b>'+(hint?'<small>'+hint+'</small>':'')+'</span><input class="num" inputmode="decimal" data-in="'+p+'" data-num="1" data-sel="1" value="'+esc(v)+'"></label>';
  return '<header class="top"><div><div class="kicker">Preferences</div><h1>Settings</h1></div></header>'
   +'<section class="blk"><h2>Training</h2>'
   +'<label class="trow"><span><b>Units</b><small>Changing this only changes labels. Logged numbers are not converted.</small></span><select data-in="settings.units"><option value="lb"'+(s.units==='lb'?' selected':'')+'>lb</option><option value="kg"'+(s.units==='kg'?' selected':'')+'>kg</option></select></label>'
   +numf('settings.rest','Default rest (seconds)',s.rest,'Routines can set their own per exercise. 0 turns the timer off.')
   +numf('settings.goal','Workouts per week goal',s.goal,'Drives the weekly ring and streak.')
   +numf('settings.inc','Default weight jump',s.inc,'Used when an exercise has no jump of its own. Set one per exercise on its page.')
   +tog('settings.rpe','Log RPE',s.rpe,'RPE 8 is about 2 reps in reserve.')
   +tog('settings.sound','Timer and record sounds',s.sound,'')
   +tog('settings.awake','Keep screen awake while training',s.awake,'')
   +'</section>'
   +'<section class="blk"><h2>Barbell plates</h2>'+numf('settings.bar','Bar weight',s.bar,'')
   +'<label class="trow"><span><b>Plates you own</b><small>Per side, comma separated.</small></span><input class="txt" data-in="settings.plates" value="'+esc(s.plates)+'"></label></section>'
   +'<section class="blk"><h2>Data</h2><p class="muted small" id="sync-line">'+syncLine()+'</p><p class="muted small">'+(S.mode==='cloud'?'Your log is saved with your Claude login, so it follows you across devices.':'Your log is saved in this browser only. Open the page from the Claude app to keep it across devices.')+'</p>'
   +'<div class="col gap"><button class="btn sec" data-act="exportcsv">'+ic('download',18)+' Export workouts (CSV)</button><button class="btn sec" data-act="exporttxt">'+ic('download',18)+' Export history (text file)</button><button class="btn sec" data-act="exportjson">'+ic('download',18)+' Back up everything (JSON)</button><button class="btn sec" data-act="importpick">'+ic('upload',18)+' Import CSV or backup</button><input type="file" id="f-import" accept=".csv,.json,text/csv,application/json,text/plain" hidden></div>'
   +'<p class="muted small">CSV import reads Strong exports. Hevy files are read on a best-effort basis by matching column names. Weights are imported as written, with kg or lb columns converted to your unit.</p></section>'
   +'<section class="blk"><h2>Danger zone</h2><button class="btn danger-o" data-act="wipew">Delete all workout history</button></section>';
}

/* ================= screens ================= */
function screenView(top){
  switch(top.t){
    case 'workout':return workoutScreen();
    case 'wdetail':return wdetailScreen(top.id);
    case 'routine':return routineScreen();
    case 'exdetail':return exdetailScreen(top.id);

const back=(label,act)=>'<button class="iconbtn" data-act="'+(act||'pop')+'" aria-label="'+(label||'Back')+'">'+ic('left',22)+'</button>';

/* ---------- live workout editor ---------- */
function liveStats(){
  const c=S.cur;if(!c)return '';
  let vol=0,n=0;
  c.exs.forEach(ex=>ex.sets.forEach(s=>{if(s.done&&s.t!=='w'){n++;vol+=setVol(ex,s);}}));
  return fmtV(vol)+' '+unit()+' · '+n+' set'+(n===1?'':'s');
}
function prevFor(ex,si,pv){
  if(!pv)return null;
  const ps=pv.ex.sets;
  if(ex.sets[si].t==='w'){const k=ex.sets.slice(0,si).filter(s=>s.t==='w').length;return ps.filter(s=>s.t==='w')[k]||null;}
  const k=ex.sets.slice(0,si).filter(s=>s.t!=='w').length;
  return ps.filter(s=>s.t!=='w')[k]||null;
}
function setLabel(ex,si){
  const s=ex.sets[si];
  if(s.t==='w')return 'W';if(s.t==='d')return 'D';if(s.t==='f')return 'F';
  return String(ex.sets.slice(0,si+1).filter(x=>x.t==='n'||x.t==='d'||x.t==='f').length);
}
function colHeads(ex){
  const u=unit();
  switch(ex.ty){
    case 'wr':return [u,'Reps'];
    case 'bwx':return ['+'+u,'Reps'];
    case 'band':return ['Band','Reps'];
    case 'bw':return ['Reps'];
    case 'dur':return ['Seconds'];
  }
  return [];
}
function setRow(ex,xi,s,si,pv){
  const rp=S.settings.rpe,p=prevFor(ex,si,pv),base='cur.exs.'+xi+'.sets.'+si;
  const inp=(k,ph,lab,cls)=>'<input class="num'+(cls?' '+cls:'')+'" inputmode="decimal" autocomplete="off" data-in="'+base+'.'+k+'" data-num="1" data-sel="1" value="'+(s[k]==null?'':esc(s[k]))+'" placeholder="'+esc(ph)+'" aria-label="'+esc(lab)+'">';
  const t=ex.ty;let cells='',cols='34px minmax(52px,1fr)';
  const repPh=s.ph!=null?s.ph:(p&&p.r!=null?p.r:'');
  if(t==='wr'||t==='bwx'||t==='band'){
    cells=inp('w',p&&p.w!=null?p.w:(t==='bwx'?'BW':''),t==='band'?'Band level':'Weight')+inp('r',repPh,'Reps');cols+=' 64px 56px';
  }else if(t==='bw'){cells=inp('r',repPh,'Reps');cols+=' 76px';}
  else{
    const run=S.sw&&S.sw.xi===xi&&S.sw.si===si;
    cells='<div class="durc">'+inp('s',s.ph!=null?s.ph:(p&&p.s!=null?p.s:''),'Seconds')+'<button class="swb'+(run?' on':'')+'" data-act="sw" data-xi="'+xi+'" data-si="'+si+'" aria-label="'+(run?'Stop stopwatch':'Start stopwatch')+'">'+(run?'<span id="sw-lbl">0</span>':ic('timer',16))+'</button></div>';cols+=' 112px';
  }
  if(rp){cells+=inp('rpe','–','RPE','rpe');cols+=' 44px';}
  cols+=' 42px';
  const pt=p?esc(setTxt(ex,p)):'–';
  const prs=s.pr&&s.pr.length&&s.done?'<div class="prline">'+ic('trophy',14)+' New record · '+[...new Set(s.pr.map(k=>PRL[k]))].join(', ')+'</div>':'';
  return '<div class="srow'+(s.done?' done':'')+'" style="grid-template-columns:'+cols+'"><button class="sn t-'+s.t+'" data-act="setmenu" data-xi="'+xi+'" data-si="'+si+'" aria-label="Set '+setLabel(ex,si)+' options">'+setLabel(ex,si)+'</button><span class="pv">'+pt+'</span>'+cells+'<button class="chk'+(s.done?' on':'')+'" data-act="done" data-xi="'+xi+'" data-si="'+si+'" aria-pressed="'+(!!s.done)+'" aria-label="Mark set done">'+ic('check',18)+'</button></div>'+prs;
}
function exBlock(ex,xi){
  const c=S.cur,pv=lastOf(ex.xid,c.id);

  const heads=colHeads(ex);

  let cols='34px minmax(52px,1fr)';
  if(heads.length===2)cols+=' 64px 56px';else cols+=ex.ty==='dur'?' 112px':' 76px';
  if(rp)cols+=' 44px';cols+=' 42px';
  const hd='<div class="srow head" style="grid-template-columns:'+cols+'"><span>Set</span><span>Previous</span>'+heads.map(h=>'<span>'+esc(h)+'</span>').join('')+(rp?'<span>RPE</span>':'')+'<span></span></div>';
  const tgt=ex.rmax?'<span class="tgt">Target '+ex.sets.length+'×'+(ex.rmin===ex.rmax?ex.rmax:ex.rmin+'–'+ex.rmax)+(ex.ty==='dur'?' s':'')+(ex.un?' per side':'')+'</span>':(ex.un?'<span class="tgt">Per side</span>':'');
  const hint=ex.hint?'<div class="hint '+(ex.hk||'')+'">'+esc(ex.hint)+'</div>':'';
  const rest=ex.rest===0?'Rest off':'Rest '+(ex.rest==null?S.settings.rest:ex.rest)+'s';
  return '<section class="exb'+(ex.ss?' ss':'')+(linked?' linked':'')+'"><div class="exh"><span class="exi">'+pad(xi+1)+'</span><div class="exn"><button class="exname" data-act="exopen" data-id="'+esc(ex.xid)+'">'+esc(ex.name)+'</button><div class="exm">'+tgt+'<span>'+rest+'</span>'+(ex.ss?'<span class="ssb">Superset'+(linked?' with next':'')+'</span>':'')+'</div></div><button class="iconbtn" data-act="exmenu" data-xi="'+xi+'" aria-label="Exercise options">'+ic('more')+'</button></div>'
   +hint
   +(ex.noteOn?'<textarea class="exnote" rows="2" data-in="cur.exs.'+xi+'.note" placeholder="Exercise note">'+esc(ex.note)+'</textarea>':(ex.note?'<button class="cue" data-act="exnoteedit" data-xi="'+xi+'" aria-label="Edit note">'+esc(ex.note)+'</button>':''))
   +'<div class="sets">'+hd+ex.sets.map((s,si)=>setRow(ex,xi,s,si,pv)).join('')+'</div>'
   +'<button class="btn ghost addset" data-act="addset" data-xi="'+xi+'">'+ic('plus',16)+' Add set</button></section>';
}

  switch(sh.t){

      const ex=S.cur.exs[sh.xi],d=exOf(ex.xid),nx=S.cur.exs[sh.xi+1],linked=ex.ss&&nx&&nx.ss===ex.ss;
      const item=(a,l,i,cls)=>'<button class="mi '+(cls||'')+'" data-act="'+a+'">'+ic(i,20)+'<span>'+l+'</span></button>';
      inner='<h3 class="sh-t">'+esc(ex.name)+'</h3>'+item('exnote','Add or edit note','note')+item('exreplace','Replace exercise','swap')
       +(nx?item('exlink',linked?'Remove superset with next':'Superset with next','link'):'')
       +(sh.xi>0?item('exup','Move up','up'):'')+(nx?item('exdown','Move down','down'):'')
       +((ex.ty==='wr'||ex.ty==='bwx')?item('exwarm','Add warm-up sets','flame'):'')
       +(d&&d.equip==='Barbell'?item('explate','Plate calculator','bell'):'')
       +'<label class="trow"><span><b>Rest timer (seconds)</b><small>0 turns it off for this exercise.</small></span><input class="num" inputmode="numeric" data-in="cur.exs.'+sh.xi+'.rest" data-num="1" data-sel="1" value="'+esc(ex.rest==null?'':ex.rest)+'" placeholder="'+S.settings.rest+'"></label>'
       +item('exdel','Remove exercise','trash','danger');break;}

function plateCalc(target){
  const bar=num(S.settings.bar)||45;
  const list=String(S.settings.plates).split(',').map(num).filter(x=>x>0).sort((a,b)=>b-a);
  if(target==null)return {empty:true};
  let per=(target-bar)/2;
  if(per<0)return {err:'That is below the bar weight.'};
  const used=[];
  list.forEach(p=>{while(per+1e-9>=p){used.push(p);per-=p;}});
  return {used:used,left:Math.round(per*2*100)/100,total:Math.round((target-per*2)*100)/100};
}
function plateOut(r){
  if(r.empty)return '<p class="muted">Enter a target weight.</p>';
  if(r.err)return '<p class="muted">'+r.err+'</p>';
  return '<p class="platebig">'+(r.used.length?r.used.map(fw).join(' + '):'Bar only')+'</p><p class="muted">Each side. Loaded total '+fw(r.total)+' '+unit()+(r.left>0?'. '+fw(r.left)+' '+unit()+' short with your plates.':'.')+'</p>';
}

/* ================= rest timer, clocks, sound, wake lock ================= */
let AC=null;
function beep(f,d,v){
  if(!S.settings.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
   const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=v||0.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
function startRest(ex,s,xi){
  const exs=S.cur.exs,nx=exs[xi+1];
  if(ex.ss&&nx&&nx.ss===ex.ss)return;
  let secs=ex.rest==null?S.settings.rest:ex.rest;
  if(!secs||secs<=0)return;
  if(s.t==='w')secs=Math.min(secs,45);
  S.rest={end:Date.now()+secs*1000,total:secs};
}
function renderRest(){
  const el=$('#rest');if(!el)return;
  if(!S.rest){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML='<div class="rest-p" id="rest-p"></div><span class="rest-l">Rest</span><b id="rest-t">0:00</b><button class="rb" data-act="restadd" data-v="-15">−15</button><button class="rb" data-act="restadd" data-v="15">+15</button><button class="rb skip" data-act="restskip">Skip</button>';
  tickRest();
}
function tickRest(){
  if(!S.rest)return;
  const left=Math.ceil((S.rest.end-Date.now())/1000);
  if(left<=0){
    S.rest=null;beep(880,.22,.1);setTimeout(()=>beep(1175,.34,.1),260);
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    renderRest();return;
  }
  const t=$('#rest-t');if(t)t.textContent=clock(left);
  const p=$('#rest-p');if(p)p.style.width=Math.max(0,Math.min(100,100-left/S.rest.total*100))+'%';
}
setInterval(()=>{
  tickRest();
  if(S.cur&&S.curNew){
    const e=$('#el-clock');if(e)e.textContent=clock((Date.now()-S.cur.start)/1000);
    const b=$('#bn-clock');if(b)b.textContent=clock((Date.now()-S.cur.start)/1000)+' · '+(S.cur.title||'Untitled');
  }
  if(S.sw){const l=$('#sw-lbl');if(l)l.textContent=Math.round((Date.now()-S.sw.t0)/1000);}
},250);
let wl=null,wlBusy=false;
async function syncAwake(){
  if(wlBusy)return;wlBusy=true;
  try{
    const want=S.settings.awake&&S.cur&&S.curNew&&S.stack.some(x=>x.t==='workout')&&!document.hidden;
    if(want&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}
    else if(!want&&wl){await wl.release();wl=null;}
  }catch(e){wl=null;}
  wlBusy=false;
}

const defaultTitle=ms=>{const h=new Date(ms).getHours();return (h<12?'Morning':h<17?'Afternoon':'Evening')+' workout';};
function saveActive(){
  if(!S.cur||!S.curNew)return;

  LS.set('active',rec);   // the in-progress draft lives on this phone only
}
function clearActive(){LS.del('active');}
function openWorkout(){if(!S.stack.some(x=>x.t==='workout'))S.stack.push({t:'workout'});render();}
function beginCur(c,openPicker){
  S.cur=c;S.curNew=true;saveActive();

function startRoutine(r){
  const c=newCur(r.name,r.id);c.rnote=r.note||'';
  r.exs.forEach(spec=>{const d=exOf(spec.xid);if(d)c.exs.push(mkEx(d,spec));});
  normSS(c.exs);beginCur(c,false);
}
function prFlags(c){
  const o=new Set();
  c.exs.forEach((ex,xi)=>ex.sets.forEach((s,si)=>(s.pr||[]).forEach(f=>o.add(xi+':'+si+':'+f))));
  return o;
}
function announcePR(c,before){
  const now=prFlags(c);const got=[];
  now.forEach(k=>{if(!before.has(k)){const p=k.split(':');got.push({ex:c.exs[+p[0]],f:p[2]});}});
  if(!got.length)return;
  const labels=[...new Set(got.map(g=>PRL[g.f]))].join(', ');
  toast('New record: '+got[0].ex.name+' · '+labels,'pr');
  beep(988,.12,.09);setTimeout(()=>beep(1319,.18,.09),140);
}
function addExercisesTo(target,ids,replaceXi){
  if(target==='cur'){
    if(replaceXi!=null){
      const old=S.cur.exs[replaceXi],d=exOf(ids[0]);if(!d)return;
      S.cur.exs[replaceXi]=mkEx(d,{sets:old.sets.length,rest:old.rest,rmin:old.rmin,rmax:old.rmax,ss:old.ss,note:old.note});
    }else ids.forEach(id=>{const d=exOf(id);if(d)S.cur.exs.push(mkEx(d,{sets:3}));});
    saveActive();
  }else if(target==='rd'){
    ids.forEach(id=>{const d=exOf(id);if(!d)return;const rr=d.type==='band'?[12,15]:d.type==='dur'?[20,40]:[8,12];S.rd.exs.push({xid:id,sets:3,rmin:rr[0],rmax:rr[1],rest:null,note:'',ss:null});});
  }
}
function finalizeFromSheet(){
  const c=S.cur,sh=S.sheet;
  const w=clone(c);
  const st=parseDT(sh.date,sh.time)||c.start;
  w.start=st;w.end=st+Math.max(1,sh.mins||1)*60000;
  w.exs=w.exs.map(ex=>{
    ex.sets=ex.sets.filter(s=>s.done&&hasVal(ex,s));
    ex.sets.forEach(s=>{delete s.ph;s.done=true;});
    delete ex.noteOn;delete ex.hint;delete ex.hk;return ex;
  }).filter(ex=>ex.sets.length);
  delete w.rnote;
  return w;
}

function csvEsc(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function saveFile(filename,text){
  try{
    const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(d){await d.save({filename:filename,data:text});toast('Saved '+filename);return;}
  }catch(e){if(e&&e.code==='declined')return;}
  S.sheet={t:'text',title:filename,text:text};render();
}
function exportCSV(){
  const H=['Date','Workout Name','Duration','Exercise Name','Set Order','Weight','Reps','Distance','Seconds','Notes','Workout Notes','RPE','Set Type'];
  const rows=[H.join(',')];
  S.workouts.slice().sort((a,b)=>a.start-b.start).forEach(w=>{
    w.exs.forEach(ex=>ex.sets.forEach((s,i)=>{
      rows.push([ymd(w.start)+' '+hm(w.start)+':00',w.title,fmtDur(w.dur),ex.name,i+1,s.w==null?'':s.w,s.r==null?'':s.r,'',s.s==null?'':s.s,ex.note||'',w.notes||'',s.rpe==null?'':s.rpe,{n:'normal',w:'warmup',d:'drop',f:'failure'}[s.t]||'normal'].map(csvEsc).join(','));
    }));
  });
  saveFile('iron-ledger-workouts.csv',rows.join('\n'));
}
function exportTXT(){
  const u=S.settings.units||'lb';
  const out=['IRON LEDGER - WORKOUT HISTORY','Exported '+ymd(Date.now())+' · weights in '+u,''];
  const ws=S.workouts.slice().sort((a,b)=>b.start-a.start);
  if(!ws.length)out.push('No workouts logged yet.');
  ws.forEach(w=>{
    out.push('='.repeat(44));
    out.push(ymd(w.start)+'  '+(w.title||'Workout')+(w.dur?'  ('+fmtDur(w.dur)+')':''));
    out.push('-'.repeat(44));
    (w.exs||[]).forEach(ex=>{
      const sets=(ex.sets||[]).map(s=>(s.t==='w'?'W ':s.t==='d'?'D ':s.t==='f'?'F ':'')+setTxt(ex,s)+(s.rpe!=null&&s.rpe!==''?' @'+s.rpe:''));
      out.push(ex.name+': '+sets.join(', '));
      if(ex.note)out.push('   note: '+ex.note);
    });
    if(w.notes)out.push('Notes: '+w.notes);
    out.push('');
  });
  out.push('Key: weight×reps, W warm-up, D drop set, F failure, @ RPE. Timed sets are in seconds.');
  saveFile('iron-ledger-history.txt',out.join('\n'));
}
function exportJSON(){
  saveFile('iron-ledger-backup.json',JSON.stringify({v:1,exported:Date.now(),settings:S.settings,routines:S.routines,custom:S.custom,body:S.body,workouts:S.workouts}));
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=c=>first.split(c).length-1;
  const delim=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f='';}
    else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(ch!=='\r')f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseWhen(s){let t=Date.parse(s);if(isNaN(t))t=Date.parse(String(s).replace(' ','T'));if(isNaN(t))t=new Date(s).getTime();return isNaN(t)?null:t;}
function parseDurSec(s){
  s=String(s||'').trim();if(!s)return 0;
  const h=/(\d+)\s*h/i.exec(s),m=/(\d+)\s*m/i.exec(s),x=/(\d+)\s*s/i.exec(s);
  if(h||m||x)return (h?+h[1]*3600:0)+(m?+m[1]*60:0)+(x?+x[1]:0);
  const n=parseFloat(s);return isFinite(n)?n:0;
}
const normName=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2)return {err:'No rows found in that file.'};
  const hdr=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));
  const col=function(){for(let k=0;k<arguments.length;k++){const i=hdr.indexOf(arguments[k]);if(i>=0)return i;}return -1;};
  const cD=col('date','start_time','start','workout_date','datetime'),cT=col('workout_name','title','workout','workout_title'),cDur=col('duration','workout_duration'),cEnd=col('end_time'),
   cEx=col('exercise_name','exercise_title','exercise'),cOrd=col('set_order','set_index','set','set_number'),cW=col('weight','weight_lbs','weight_lb','weight_kg','weight_kgs'),
   cR=col('reps','rep'),cS=col('seconds','duration_seconds','time_seconds'),cRpe=col('rpe'),cN=col('notes','exercise_notes'),cWN=col('workout_notes','description','workout_note'),cTy=col('set_type');
  if(cD<0||cEx<0)return {err:'Could not find Date and Exercise columns. Expected a Strong-style export.'};
  const wn=cW>=0?hdr[cW]:'';
  const conv=/kg/.test(wn)?(S.settings.units==='lb'?2.20462:1):(/lb/.test(wn)?(S.settings.units==='kg'?0.453592:1):1);
  const groups=new Map(),kinds={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i],ds=(r[cD]||'').trim(),exn=(r[cEx]||'').trim();if(!ds||!exn)continue;
    const title=cT>=0?(r[cT]||'').trim():'',key=ds+'|'+title;
    if(!groups.has(key))groups.set(key,{ds:ds,title:title,rows:[]});
    groups.get(key).rows.push(r);
    const k=kinds[exn]=kinds[exn]||{w:false,r:false,s:false};
    if((num(r[cW])||0)>0)k.w=true;if((num(r[cR])||0)>0)k.r=true;if(cS>=0&&(num(r[cS])||0)>0)k.s=true;
  }
  const byName={};exList().forEach(d=>{byName[normName(d.name)]=d;});
  let created=0,nSets=0;
  const resolve=n=>{
    const key=normName(n);if(byName[key])return byName[key];
    const k=kinds[n]||{},ty=k.w?'wr':(k.s&&!k.r?'dur':'bw');
    const d={id:rid('c'),name:n,muscle:'Other',sec:[],equip:'Other',type:ty,uni:false,dual:false,inc:null};
    S.custom.list.push(d);S._ex=null;byName[key]=Object.assign({custom:true},d);created++;return byName[key];
  };
  const out=[];
  groups.forEach(g=>{
    const start=parseWhen(g.ds);if(start==null)return;
    if(S.workouts.some(w=>Math.abs(w.start-start)<60000&&(w.title||'')===g.title))return;
    let dur=0;const r0=g.rows[0];
    if(cEnd>=0){const e=parseWhen(r0[cEnd]||'');if(e)dur=(e-start)/1000;}
    if(!(dur>0)&&cDur>=0)dur=parseDurSec(r0[cDur]);
    if(!(dur>0))dur=45*60;
    const w={id:rid('w'),title:g.title||defaultTitle(start),routineId:null,start:start,end:start+dur*1000,notes:cWN>=0?(r0[cWN]||''):'',exs:[]};
    const order=[],map={};
    g.rows.forEach(r=>{
      const exn=(r[cEx]||'').trim();if(!exn)return;
      const d=resolve(exn);
      if(!map[exn]){map[exn]={xid:d.id,name:d.name,ty:d.type,du:!!d.dual,un:!!d.uni,mu:d.muscle,se:d.sec||[],note:'',ss:null,rest:null,rmin:0,rmax:0,sets:[]};order.push(map[exn]);}
      const ex=map[exn];
      if(cN>=0&&r[cN]&&!ex.note)ex.note=r[cN];
      const os=String(cOrd>=0?r[cOrd]:'').trim().toLowerCase(),ts=String(cTy>=0?r[cTy]:'').toLowerCase();
      let t='n';
      if(/warm/.test(ts)||/^w/.test(os))t='w';else if(/drop/.test(ts)||/^d/.test(os))t='d';else if(/fail/.test(ts)||/^f/.test(os))t='f';
      let wt=num(r[cW]);if(wt!=null)wt=Math.round(wt*conv*10)/10;
      const reps=num(r[cR]),sec=cS>=0?num(r[cS]):null;
      if(!reps&&!sec)return;
      ex.sets.push({t:t,w:wt||null,r:reps||null,s:sec||null,rpe:cRpe>=0?num(r[cRpe]):null,done:true,pr:[]});nSets++;
    });
    w.exs=order.filter(e=>e.sets.length);
    if(w.exs.length){summarize(w);out.push(w);}
  });
  return {out:out,created:created,sets:nSets};
}
async function handleImport(file){
  if(!file)return;
  let text;try{text=await file.text();}catch(e){toast('Could not read that file','bad');return;}
  try{
    if(/\.json$/i.test(file.name)||/^\s*\{/.test(text)){
      const o=JSON.parse(text);let added=0;
      if(o.settings)Object.assign(S.settings,o.settings);
      const idmap={};
      (o.routines||[]).forEach(r=>{
        const i=S.routines.findIndex(x=>x.id===r.id||(x.name===r.name&&(x.folder||'')===(r.folder||'')));
        if(i>=0){idmap[r.id]=S.routines[i].id;S.routines[i]=Object.assign({},r,{id:S.routines[i].id});}
        else S.routines.push(r);
      });
      if(o.custom){(o.custom.list||[]).forEach(d=>{if(!S.custom.list.some(x=>x.id===d.id))S.custom.list.push(d);});Object.assign(S.custom.over,o.custom.over||{});(o.custom.arch||[]).forEach(a=>{if(S.custom.arch.indexOf(a)<0)S.custom.arch.push(a);});}
      if(o.body&&o.body.entries)o.body.entries.forEach(e=>{if(!S.body.entries.some(x=>x.t===e.t))S.body.entries.push(e);});
      const fresh=(o.workouts||[]).filter(w=>!S.workouts.some(x=>x.id===w.id));
      fresh.forEach(w=>{if(w.routineId&&idmap[w.routineId])w.routineId=idmap[w.routineId];});
      S._ex=null;Store.save('settings',S.settings,0);Store.save('routines',{list:S.routines,seeded:true,fullBody20261121:true},0);Store.save('custom',S.custom,0);Store.save('body',S.body,0);
      for(const w of fresh){S.workouts.push(w);await Store.putW(w);added++;}
      rebuildIdx();toast('Backup imported: '+added+' workouts added');render();return;
    }
    const res=importCSV(text);
    if(res.err){toast(res.err,'bad');return;}
    if(!res.out.length){toast('Nothing new to import. Those workouts may already be here.');return;}
    Store.save('custom',S.custom,0);
    toast('Importing '+res.out.length+' workouts…');
    for(const w of res.out){S.workouts.push(w);await Store.putW(w);}
    rebuildIdx();toast('Imported '+res.out.length+' workouts, '+res.sets+' sets'+(res.created?' and '+res.created+' new exercises':''));render();
  }catch(e){console.warn(e);toast('That file could not be imported','bad');}
}

/* ================= events ================= */
function setPath(path,v){
  const k=path.split('.');let o=S;
  for(let i=0;i<k.length-1;i++){if(o[k[i]]==null||typeof o[k[i]]!=='object')o[k[i]]={};o=o[k[i]];}
  o[k[k.length-1]]=v;
}
function onChange(p,type){
  if(p.indexOf('cur.')===0){saveActive();updateLive();return;}
  if(p.indexOf('settings.')===0){Store.save('settings',S.settings);if(type==='change'&&/units|rpe|sound|awake/.test(p))render();return;}
  if(p.indexOf('custom.')===0){S._ex=null;Store.save('custom',S.custom);return;}
  if(p==='ex.q'||p==='ex.e'||p==='ex.arch'){refreshExList();return;}
  if(p.indexOf('st.')===0){if(type==='change')render();return;}
  if(p.indexOf('sheet.')===0&&S.sheet){
    if(S.sheet.t==='picker')refreshPicker();
    else if(S.sheet.t==='plate'){const o=$('#pl-out');if(o)o.innerHTML=plateOut(plateCalc(S.sheet.target));}
    else if(S.sheet.t==='exedit'&&type==='change'&&/muscle$/.test(p))$('#sheet').innerHTML=sheetView();
  }
}
function bind(e){
  const t=e.target,p=t.dataset&&t.dataset.in;if(!p)return;
  let v;
  if(t.type==='checkbox')v=t.checked;else if(t.dataset.num!=null)v=num(t.value);else v=t.value;
  setPath(p,v);onChange(p,e.type);
}
document.addEventListener('input',bind);
document.addEventListener('change',e=>{
  bind(e);
  if(e.target.id==='f-import'){const f=e.target.files&&e.target.files[0];handleImport(f);e.target.value='';}
});
function showErr(what,x){
  console.warn('action failed',what,x);
  const m=String((x&&x.message)||x||'unknown').slice(0,120);
  toast('Something went wrong in "'+what+'": '+m,'bad');
}
window.addEventListener('error',e=>{try{toast('Page error: '+String(e.message||'unknown').slice(0,120),'bad');}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{const r=e.reason;if(r&&r.code)return;toast('Page error: '+String((r&&r.message)||r||'unknown').slice(0,120),'bad');}catch(x){}});
document.addEventListener('click',e=>{
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(x){}}
  const el=e.target.closest('[data-act]');
  if(el){const f=ACT[el.dataset.act];
    if(f){try{const r=f(el,e);if(r&&r.catch)r.catch(x=>showErr(el.dataset.act,x));}catch(x){showErr(el.dataset.act,x);}}
    return;}
  const ch=e.target.closest('[data-chart]');if(ch)chartPick(ch,e);
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.sel&&t.select)setTimeout(()=>{try{t.select();}catch(x){}},0);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')e.target.blur();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)Store.flushAll();else{syncAwake();if(Store.npend()){Store.wfails=0;Store.syncW();}}});
window.addEventListener('online',()=>{if(Store.npend()){Store.wfails=0;Store.syncW();}});
window.addEventListener('pagehide',()=>Store.flushAll());

/* ================= boot ================= */
function refreshSync(){const el=document.getElementById('sync-line');if(el)el.innerHTML=syncLine();}
async function boot(){
  render();
  await Store.init();
  const got=await Promise.all(['settings','routines','custom','body'].map(n=>Store.get(n)));
  const st=got[0],ro=got[1],cu=got[2],bo=got[3];
  if(st)Object.assign(S.settings,st);
  if(ro&&Array.isArray(ro.list)){S.routines=ro.list;ensureFullBodyRoutines(ro);}
  else{S.routines=seedRoutines();Store.save('routines',{list:S.routines,seeded:true,fullBody20261121:true},0);}
  if(cu)S.custom={list:cu.list||[],over:cu.over||{},arch:cu.arch||[]};
  if(bo&&Array.isArray(bo.entries))S.body.entries=bo.entries;
  let act=null;const la=LS.get('active');
  if(la&&la.w)act=la;
  if(act&&act.w){S.cur=act.w;S.curNew=true;}
  S._ex=null;S.ready=true;
  Store.subscribeW(ws=>{
    if(ws)S.workouts=ws;
    S.wLoaded=true;rebuildIdx();softRender();
  });
  setTimeout(()=>{if(!S.wLoaded){S.wLoaded=true;softRender();}},5000);
  render();
}
boot();
})();
</script>
